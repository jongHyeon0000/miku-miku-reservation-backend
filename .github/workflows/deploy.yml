name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: /opt/miku-miku-reservation
  SERVICE: miku-miku-reservation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew bootJar
          ls build/libs

      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload
        id: upload
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -n 1)
          scp -i ~/.ssh/deploy_key "$JAR" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$APP_DIR/app.jar.new"

      - name: Swap and restart
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd $APP_DIR && mv -f app.jar app.jar.prev && mv -f app.jar.new app.jar && sudo systemctl restart $SERVICE"

      - name: Health check
        id: health
        run: |
          for i in $(seq 1 30); do
            BODY=$(ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "curl -s localhost:8080/actuator/health" || true)
            echo "try $i: $BODY"
            if echo "$BODY" | grep -q '"status":"UP"'; then exit 0; fi
            sleep 3
          done
          exit 1

      # 새 jar로 바꾼 뒤 확인에 실패했을 때만 이전 jar로 되돌린다
      - name: Rollback
        if: failure() && steps.deploy.outcome == 'success' && steps.health.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd $APP_DIR && mv -f app.jar.prev app.jar && sudo systemctl restart $SERVICE"
